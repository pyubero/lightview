[package]
name = "lightview"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "persistence", "clipboard"] }
fast_image_resize = "6.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
libloading = "0.8"
little_exif = "0.6"
# ONNX Runtime itself is loaded at run time from the copy Tools → Download AI Runtime… installs.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
rfd = "0.17.2"
ron = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }

# Unoptimised decoders are 10–50× slower; keep dependencies fast in debug builds.
[profile.dev.package."*"]
opt-level = 3
