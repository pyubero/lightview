[package]
name = "lightview"
version = "1.0.0"
edition = "2024"
description = "A simple, fast image viewer"
license = "GPL-3.0-or-later"
repository = "https://github.com/pyubero/lightview"

[dependencies]
ab_glyph = "0.2.32"
# Already in the build through `png`; the checksum of the standard PNG EXIF chunk.
crc32fast = "1.5"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "persistence", "clipboard", "accesskit"] }
fast_image_resize = "6.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "qoi", "tga", "pnm", "dds", "hdr", "exr"] }
jxl = "0.8"
libloading = "0.8"
little_exif = "0.6"
# Already in the build (roxmltree, nom); finds RAW previews in tens of megabytes.
memchr = "2.7"
# Already in the build through `image`; converts ICC profiles to sRGB.
moxcms = "0.8"
# ONNX Runtime itself is loaded at run time from the copy Tools → Download AI Runtime… installs.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31", "cuda"] }
resvg = "0.49"
rfd = "0.17.2"
ron = "0.12"
roxmltree = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
rqrr = { version = "0.11", default-features = false }

[target.'cfg(windows)'.dependencies]
# Already in the dependency tree (winit); only for SetDllDirectoryW (GPU support) and the system language.
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_System_LibraryLoader"] }
# Already in the dependency tree (trash); for HEIC and AVIF through the system's own codecs (WIC).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the dependency tree; for the file URI that Show in File Manager sends.
percent-encoding = "2.3"

# Unoptimised decoders are 10–50× slower; keep dependencies fast in debug builds.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
# Already in the build through `image`; writes a test APNG.
png = "0.18"
# Already in the build through `image`; writes multi-page TIFFs for tests.
tiff = "0.11"

[build-dependencies]
winresource = "0.1.34"
