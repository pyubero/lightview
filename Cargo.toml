[package]
name = "lightview"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
fast_image_resize = "6.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

# Unoptimised decoders are 10–50× slower; keep dependencies fast in debug builds.
[profile.dev.package."*"]
opt-level = 3
