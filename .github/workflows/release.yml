name: Release

on:
  push:
    tags: ['v*']

jobs:
  deb:
    # The oldest supported distro: the binary needs this glibc (2.35) or newer.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: Check the tag matches Cargo.toml
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
      - run: cargo test
      - run: ./package-deb.sh
      - name: Check the package installs
        run: |
          sudo apt-get install -y ./lightview_*.deb
          test -x /usr/bin/lightview
          test -f /usr/share/applications/lightview.desktop
          grep -q '^egui ' /usr/share/doc/lightview/copyright
      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" lightview_*.deb --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
